    <h1 class="Style_1">Google Maps API Page</h1>
      <p class="Style_2"><strong>Hello!</strong> This is my Google Maps API page. I have included a fun interactable involving Google Maps below! Hover over the images to learn more about them!</p>
      <div id="map"></div>
      <script>
        function initMap() {
          const center = { lat: 41.8781, lng: -87.6298 };
          const map = new google.maps.Map(document.getElementById("map"), {
            zoom: 12,
            center: center,
          });

          const locations = [
            {
              title: "Willis Tower",
              position: { lat: 41.879052140982246, lng: -87.63586125582326 },
              image: "images/City.png",
            },
            {
              title: "The Art Institute of Chicago",
              position: { lat: 41.87974632460261, lng: -87.62231622105489 },
              image: "images/Museum.png",
            },
            {
              title: "The Chicago Theater",
              position: { lat: 41.88547423125778, lng: -87.62768516869274 },
              image: "images/Masks.png",
            },
          ];

          locations.forEach(({ title, position, image }) => {
            new google.maps.Marker({
              map,
              title,
              position,
              icon: {
                url: image,
                scaledSize: new google.maps.Size(48, 48),
              },
            });
          });
        }
      </script>
      <script async
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBM1F-BpX660SBK3-Vw9O9f7AEvTAIH8rI&amp;callback=initMap&amp;loading=async">
      </script>

</body>
