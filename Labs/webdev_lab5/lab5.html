<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Volunteer Form</title>
</head>
<body>
    <form action="http://bloomingdale.sat.iit.edu/kriedan/lab3formscript.php" method="post">
        <div>
            <!-- First Name Input-->
             <h1>Volunteer Form</h1>
             <h2>My Info</h2>
            <label for="fname">First name:</label>
            <input type="text" id="fname" name="fname">
        </div>
        <div>
            <!-- Last Name Input -->
            <label for="lname">Last name:</label>
            <input type="text" id="lname" name="lname">
        </div>
        <div>
        <!-- Telephone Input -->  
            <label for="phone">Enter a phone number:</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}">
        </div>
        <div>
        <!-- Email Input -->
            <label for="email">Enter your email:</label>
            <input type="email" id="email" name="email">
        </div>
        <div>
        <!-- Gender Radio Buttons --> 
            <p>Gender:</p>
            <input type="radio" id="html" name="gender" value="HTML">
            <label for="html">Male</label>
            <input type="radio" id="css" name="gender" value="CSS">
            <label for="css">Female</label>
        </div>
        <div>
        <!-- Age Dropdown Menu -->
            <label for="Age">Age:</label>
            <select id="Age" name="Age">
                <option value="under-18">under 18</option>
                <option value="over-18">over 18</option>
            </select>
        </div>
        <div>
        <!-- Days Available Checkboxes -->
            <p>My Availability:</p>
            <p><strong>Days Available:</strong></p>
            <input type="checkbox" id="Sunday" name="Sunday" value="Sunday">
            <label for="Sunday"> Sunday</label>
            <input type="checkbox" id="Monday" name="Monday" value="Monday">
            <label for="Monday"> Monday</label>
            <input type="checkbox" id="Tuesday" name="Tuesday" value="Tuesday">
            <label for="Tuesday"> Tuesday</label>
            <input type="checkbox" id="Wednesday" name="Wednesday" value="Wednesday">
            <label for="Wednesday"> Wednesday</label>
            <input type="checkbox" id="Thursday" name="Thursday" value="Thursday">
            <label for="Thursday"> Thursday</label>
            <input type="checkbox" id="Friday" name="Friday" value="Friday">
            <label for="Friday"> Friday</label>
            <input type="checkbox" id="Saturday" name="Saturday" value="Saturday">
            <label for="Saturday"> Saturday</label>
        </div>
        <div>
            <!-- Comment Box -->
            <label for="comment"><strong>Comments:</strong></label>
            <textarea id="comment" name="comment" rows="4" cols="50"></textarea>
        </div>
        <!-- Submit Button -->
        <input type="submit" value="Submit Query">
        <!-- Hidden Area -->
        <input type="hidden" id="custId" name="custId" value="HTML Form created by: Jonathan Luna">
    </form>
</body>
</html>
